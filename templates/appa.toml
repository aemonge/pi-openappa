# ─── Sanitizers ────────────────────────────────────────────────────────────
#
# redact-secrets masks private-key blocks, well-known token shapes, the AWS
# secret access key, secret-named assignment values, and long high-entropy
# runs. It is offered for every withheld Bash/PowerShell result (see
# confined_results below), so a credential-narrowed command still returns
# useful, masked output. It runs inside the runtime.

[[policy.sanitizer]]
name = "redact-secrets"
on = ["tool_output"]

[policy.sanitizer.permits]
audience = { from = ["self"], to = ["public"] }

# attest-schema is the reserved builtin for a structured subagent return: the
# spawn call declares a JSON schema, and a final message matching it crosses
# at this session's own trust instead of the rank the subagent's reads left
# it at. Runs in the runtime itself; needs no externals entry.

[[policy.sanitizer]]
name = "attest-schema"
on = ["tool_output"]

[policy.sanitizer.permits]
trust = { from = "suspicious", to = "trusted" }

# ─── Deployment: how subagents start, which results are held back ──────────

[policy.deployment]
context_control = true
confined_results = ["host/claude-code/Bash", "host/claude-code/PowerShell"]

# ─── Externals: only runtime builtins, nothing host-coupled ────────────────
# timeout_ms and max_body_bytes are required fields of [externals].

[externals]
timeout_ms = 5000
max_body_bytes = 65536

[externals.sanitizers.redact-secrets]
builtin = "redact-secrets"

# ─── Reporting ─────────────────────────────────────────────────────────────

[reporting]
agent_yell = false

# ─── Undeclared tools ──────────────────────────────────────────────────────
#
# Deny-by-default, and under static rules the only stance: appa requires a
# wildcard `*` entry to name an annotator and forbids static delta on it.
# A tool this file does not name is refused before execution, with the
# runtime's reason — declare new MCP tools by copying a block above, under
# their verbatim Pi name.
#
# If you want per-call classification of unknown tools instead, register a
# model annotator (builtin = "llm", see the OpenAPPA policy reference) and
# bind the wildcard to it. The trade is reachability and latency in the
# decision path — the host-coupled-annotator failure this policy exists to
# avoid — so it stays commented out:
#
# [[policy.annotator]]
# name = "classify-unknown"
# builtin = "llm"
#
# [[policy.tool]]
# name = "*"
# annotator = "classify-unknown"
