# ─── Edit: research lands in docs, it does not rewrite code ────────────────
#
# Documentation first (the landing zone): docs directories, openspec, and
# markdown anywhere stay editable even by a tainted session — that is where
# research output belongs. Everything else below requires a fully trusted
# trajectory: a session that curled a blog post may create new files (see
# Write) and edit docs, but not touch existing code. This mirrors the
# read-only scout / full Engineer split: research sessions report, clean
# sessions build.

