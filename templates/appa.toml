# ─── Bash: publishing — tainted data may not leave the machine ─────────────
#
# A push, PR, issue, release, or API call carries the session's data to a
# remote: the injection-to-GitHub exfil channel. Deterministic "ask": the
# call runs only from a clean (fully trusted) trajectory. Normal `git
# commit` is NOT fenced — local history stays local. Blocked after
# research? Start a fresh session and push from there.

[[policy.tool]]
name = "host/claude-code/Bash(command:*git push*)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git -* push*)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh pr *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh issue *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh release *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh api *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh repo *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh gist *)"
requires = { trust = "trusted" }
delta = {}

# ─── Bash: fetch-shaped commands are the web source ────────────────────────
#
# This is the middle path: not all shell output is foreign — `ls` and
# `npm test` are yours — but curl/wget return text written by strangers.
# Only these narrow trust. A session that curled a blog post keeps working
# everywhere except the fenced sinks (see the fence map).

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*)"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/Bash(command:*wget*)"
delta = { trust = "suspicious" }

# ─── Bash: every other command ─────────────────────────────────────────────
#
# Your own machine's output, trusted. (The strict alternative — marking all
# shell output suspicious — over-taints: one `ls` would refuse every
# trusted-only sink below forever, with no annotator to tell `ls` from
# `curl`. Fetch-selectors above are the honest split.)
#
# Scope note, cross-checked against community hardening guides: appa is an
# information-flow engine — it fences where DATA goes, not what a command
# DOES. Destructive-command deny-lists (`rm -rf /`, `sudo`, `chmod`,
# shutdown…) that Claude Code / Cursor configs carry are not expressible
# here (v2 has no static unconditional deny) and are deliberately out of
# scope: the OS, backups, and you remain that guard.

[[policy.tool]]
name = "host/claude-code/Bash"
description = "Runs one shell command and returns its output."
delta = {}

