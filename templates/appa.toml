# carrying suspicious data may not persist it as trusted memory — poisoned
# learnings would outlive the session and be trusted by every later one.
# Cost: after heavy web research, save memories from a fresh session (or
# relax this rule if your scouts must save mid-research — it is a one-block
# delete).

