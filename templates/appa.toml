# pi-openappa default policy — a Pi session's complete, self-contained guard.
#
# Install (either):
#   cp templates/appa.toml ~/.config/appa/appa.toml      # from a checkout
#   /appa init                                            # from inside Pi
# or scope it to one project:
#   /appa init project        # writes ./appa.toml + .pi/openappa
#
# ══════════════════════════════════════════════════════════════════════════
# THE FENCE MAP (what this file encodes; validate: `just policy-test`)
# ══════════════════════════════════════════════════════════════════════════
# appa gates flows, not tools. Sources mark data; sinks check it:
#
#   web (curl/wget, web_explore, context7)  ──suspicious──▶  the session
#   .env / credentials                      ──self-narrow─▶  the session
#
# A session that carries suspicious or self-narrowed data is REFUSED at:
#   • any edit to an existing file — except documentation (docs/, openspec/,
#     *.md): research lands in docs, it does not rewrite code          [day B]
#   • writes to files that execute later: tests, devops (Makefile,
#     justfile, scripts, CI), infra (terraform, k8s, helm…), and
#     credential-shaped paths                                          [day A]
#   • git push / gh pr|issue|release|api|repo: no tainted data leaves
#     the machine                                                       [day C]
#   • web tools after reading .env: secrets may not reach a query       [day D]
#   • mem_save / mem_update: poisoned memory must not persist           [day F]
#   • edits to appa's own policy files                                  [guard]
#
# A clean session (no web, no secrets) flows everywhere: reads, edits,
# tests, commits — nothing below ever trips.                           [day A]
#
# Reset: taint lives in the trajectory label and only narrows. The manual
# reset is a NEW session (resume/fork inherit the label). There is no
# /untaint by design.
#
# ══════════════════════════════════════════════════════════════════════════
# GROUND RULES (verified against appa 0.31.1; docs/wire-notes.md)
# ══════════════════════════════════════════════════════════════════════════
# 1. Tool naming: Pi built-ins map to Claude-Code policy names (bash→Bash,
#    read→Read, edit→Edit, write→Write, grep→Grep, find→Glob, ls→LS,
#    powershell→PowerShell); custom/MCP tools pass through verbatim
#    (`subagent`, `mem_search`, …), declared here under their Pi names.
# 2. Argument naming: `tool_input` crosses the wire exactly as Pi sent it,
#    so selectors use Pi's argument names — Read/Edit/Write take `path`,
#    Bash/PowerShell take `command`. The stock claude-code battery selects
#    on `file_path` and never matches a Pi call; this file spells it right.
# 3. No annotators, on purpose: `builtin = "claude-code"` annotators are
#    host-coupled and unreachable under Pi (they fail closed and withhold
#    results). This policy is static rules only — nothing here can be
#    unreachable. Consequence: deny-undeclared is the only stance (a `*`
#    wildcard REQUIRES an annotator; static deltas on it refuse to load).
# 4. Rules match in order; first match wins. Selector patterns are globs on
#    the full argument value (`*` = any sequence).
# 5. Approximations: `write` cannot distinguish create from overwrite, so
#    "research may create, never overwrite" is enforced for protected
#    categories only; a tainted overwrite of unprotected src via `write`
#    is a documented hole (use `edit` discipline). "Flow ends after a docs
#    edit" is approximated by docs being the only tainted-editable sink.

[policy]
version = 2

# ─── Bash: commands that name requester credentials are `self` data ────────
#
# Narrows the session to `self`: the result is withheld and `redact-secrets`
# (below) masks tokens before the output returns to `public`. A selector is
# a glob on the command as written; a spelling these miss — inside `$(...)`,
# a heredoc, an alias — falls through to later rules. Extend freely.

[[policy.tool]]
name = "host/claude-code/Bash(command:*.env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.claude.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
