# pi-openappa default policy — a Pi session's complete, self-contained guard.
#
# Install (either):
#   cp templates/appa.toml ~/.config/appa/appa.toml      # from a checkout
#   /appa init                                            # from inside Pi
# or scope it to one project:
#   /appa init project        # writes ./appa.toml + .pi/openappa
#
# ══════════════════════════════════════════════════════════════════════════
# THE FENCE MAP — armed, and remedy-gated until 0.4
# ══════════════════════════════════════════════════════════════════════════
# appa gates flows, not tools: sources mark data (narrow the label), sinks
# check it. The live runtime proved (integration tier, 2026-10-09) that
# EVERY narrowing — trust or audience — is confirmation-gated: the runtime
# blocks the call and offers a remedy plan, accepted through the
# `appa/execute_remedy_plan` MCP tool. Claude Code mounts that tool via the
# appa plugin; Pi sessions do not have it (yet — 0.4 exposes it as a Pi
# tool, at which point this map lights up exactly as written).
#
# So TODAY, with no remedy tool under Pi:
#   - nothing narrows, so no fence ever trips: sessions flow everywhere
#   - an undeclared tool is still refused (the one live tooth)
#   - the narrowing deltas are stripped from this file precisely because a
#     delta that can never be accepted would BLOCK routine work (web
#     research, fetches) instead of labeling it
#   - the requires-trusted sinks below are kept, armed, and inert until
#     narrowing exists again
#
# The 0.4 map, for the record (deltas return with the remedy tool):
#   web text (curl/wget, web_explore, context7)  --suspicious-->  session
#   credential files                              --self-narrow-->  session
#   refused while carrying either: edits to existing code (docs excepted),
#   writes to tests/devops/infra/credential paths, git push / gh ...,
#   mem_save / mem_update / mem_delete, and edits to this policy file.
#
# KNOWN HOLES (documented, not fenced — external review 2026-10-13):
#   - selectors match command/path TEXT as written: obfuscated spellings
#     ($(...) substitutions, heredocs, aliases, python -c / node -e fetchers)
#     fall through to the plain rules
#   - local files and MCP tool descriptions are trusted sources: a poisoned
#     in-repo README does not taint the session (0.4 candidate: annotation)
#   - once narrowing exists again: docs/ is writable by tainted sessions, and
#     a FRESH session can later push what they wrote (no file provenance)
#   - `write` cannot distinguish create from overwrite (see the Write section)
#   - destructive commands (rm -rf, sudo, chmod) are out of IFC scope: the
#     OS, backups, and you remain that guard

# ══════════════════════════════════════════════════════════════════════════
# GROUND RULES (verified against appa 0.31.1; docs/wire-notes.md)
# ══════════════════════════════════════════════════════════════════════════
# 1. Tool naming: Pi built-ins map to Claude-Code policy names (bash→Bash,
#    read→Read, edit→Edit, write→Write, grep→Grep, find→Glob, ls→LS,
#    powershell→PowerShell); custom/MCP tools pass through verbatim
#    (`subagent`, `mem_search`, …), declared here under their Pi names.
# 2. Argument naming: `tool_input` crosses the wire exactly as Pi sent it,
#    so selectors use Pi's argument names — Read/Edit/Write take `path`,
#    Bash/PowerShell take `command`. The stock claude-code battery selects
#    on `file_path` and never matches a Pi call; this file spells it right.
# 3. No annotators, on purpose: `builtin = "claude-code"` annotators are
#    host-coupled and unreachable under Pi (they fail closed and withhold
#    results). This policy is static rules only — nothing here can be
#    unreachable. Consequence: deny-undeclared is the only stance (a `*`
#    wildcard REQUIRES an annotator; static deltas on it refuse to load).
# 4. Rules match in order; first match wins. Selector patterns are globs on
#    the full argument value (`*` = any sequence).
# 5. Approximations: `write` cannot distinguish create from overwrite, so
#    "research may create, never overwrite" is enforced for protected
#    categories only; a tainted overwrite of unprotected src via `write`
#    is a documented hole (use `edit` discipline). "Flow ends after a docs
#    edit" is approximated by docs being the only tainted-editable sink.

[policy]
version = 2

# ─── Bash: credential commands ──────────────────────────────────────────────
#
# History: v2 of this policy narrowed credential commands to `self` (with
# redact-secrets masking), copying the claude-code battery. The live runtime
# proved that pattern UNANSWERABLE under Pi: an audience with no membership
# source narrows to a symbolic audience, and the runtime refuses the call
# until a remedy plan is accepted — the remedy tool (`appa/execute_remedy_plan`)
# ships as an MCP server the Claude Code plugin mounts, and Pi sessions have
# no such tool. The narrowing + masking flow returns when this extension
# exposes execute_remedy_plan as a Pi tool (0.4 roadmap). Until then,
# credential commands and reads run under the plain rules below, and the
# trusted-only sinks still fence where their content goes.

# ─── Bash: trusted documentation domains stay clean ────────────────────────
#
# The official default allow-lists trusted docs domains on WebFetch; Pi has
# no URL-argumented web tool, so the same carve-out is spelled on curl.
# Reading these keeps the session's label. PATTERNS ARE ANCHORED: each ends
# `<domain>/*`, requiring the path slash immediately after the domain, so
# `docs.anthropic.com.evil.example/`, `…com:8443/`, and `…com@evil/`
# (userinfo tricks) do NOT match — they fall through to the plain fetch
# rule and get labeled. Extend with your own domains, anchored the same
# way; wget is not carved out — add mirrors if you use it for docs.

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*docs.anthropic.com/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*code.claude.com/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*openappa.com/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*nodejs.org/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*developer.mozilla.org/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*typescriptlang.org/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*doc.rust-lang.org/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*docs.python.org/*)"
delta = {}

# ─── Bash: publishing — tainted data may not leave the machine ─────────────
#
# A push, PR, issue, release, or API call carries the session's data to a
# remote: the injection-to-GitHub exfil channel. Deterministic "ask": the
# call runs only from a clean (fully trusted) trajectory. Normal `git
# commit` is NOT fenced — local history stays local. Blocked after
# research? Start a fresh session and push from there.

[[policy.tool]]
name = "host/claude-code/Bash(command:*git push*)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git -* push*)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh pr *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh issue *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh release *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh api *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh repo *)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh gist *)"
requires = { trust = "trusted" }
delta = {}

# ─── Bash: fetch-shaped commands are the web source ────────────────────────
#
# This is the middle path: not all shell output is foreign — `ls` and
# `npm test` are yours — but curl/wget return text written by strangers.
# Only these narrow trust. A session that curled a blog post keeps working
# everywhere except the fenced sinks (see the fence map).

# (curl/wget once carried the suspicious delta that armed the fetch fence;
# see the fence map note — it returns with 0.4's remedy plumbing.)

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*wget*)"
delta = {}

# ─── Bash: every other command ─────────────────────────────────────────────
#
# Your own machine's output, trusted. (The strict alternative — marking all
# shell output suspicious — over-taints: one `ls` would refuse every
# trusted-only sink below forever, with no annotator to tell `ls` from
# `curl`. Fetch-selectors above are the honest split.)
#
# Scope note, cross-checked against community hardening guides: appa is an
# information-flow engine — it fences where DATA goes, not what a command
# DOES. Destructive-command deny-lists (`rm -rf /`, `sudo`, `chmod`,
# shutdown…) that Claude Code / Cursor configs carry are not expressible
# here (v2 has no static unconditional deny) and are deliberately out of
# scope: the OS, backups, and you remain that guard.

[[policy.tool]]
name = "host/claude-code/Bash"
description = "Runs one shell command and returns its output."
delta = {}

# ─── PowerShell: the Bash rules, spelled for Windows hosts ─────────────────
# Directory rules are written for both separators; `\\` is one literal
# backslash in a selector.

[[policy.tool]]
name = 'host/claude-code/PowerShell(command:*curl*)'
delta = {}

[[policy.tool]]
name = 'host/claude-code/PowerShell(command:*wget*)'
delta = {}

[[policy.tool]]
name = 'host/claude-code/PowerShell(command:*git push*)'
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = 'host/claude-code/PowerShell(command:*git -* push*)'
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/PowerShell"
description = "Runs one PowerShell command and returns its output."
delta = {}

# ─── Read: the requester's own secrets are `self` data ─────────────────────
# A selector matches the argument as written, absolute or relative, not the
# resolved path. Every other path keeps the session's label; no rule here
# blocks a read or lowers its trust. Pi's argument is `path`.

[[policy.tool]]
name = "host/claude-code/Read"
description = "Reads a file from the local filesystem."
delta = {}

# ─── Grep / Glob / LS: local search over this user's files ─────────────────

[[policy.tool]]
name = "host/claude-code/Grep"
description = "Searches file contents with a pattern."
delta = {}

[[policy.tool]]
name = "host/claude-code/Glob"
description = "Finds files by name pattern."
delta = {}

[[policy.tool]]
name = "host/claude-code/LS"
description = "Lists a directory."
delta = {}

# ─── Edit: research lands in docs, it does not rewrite code ────────────────
#
# Documentation first (the landing zone): docs directories, openspec, and
# markdown anywhere stay editable even by a tainted session — that is where
# research output belongs. Everything else below requires a fully trusted
# trajectory: a session that curled a blog post may create new files (see
# Write) and edit docs, but not touch existing code. This mirrors the
# read-only scout / full Engineer split: research sessions report, clean
# sessions build.

[[policy.tool]]
name = "host/claude-code/Edit(path:*/docs/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(path:docs/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(path:*/openspec/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(path:openspec/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(path:*.md)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(path:*.mdx)"
delta = {}

# The policy guards itself: a session may not rewrite the rules that bind
# it, tainted or not. Edit policies by hand, in a fresh session.

[[policy.tool]]
name = "host/claude-code/Edit(path:*/appa/appa.toml)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(path:*/appa/batteries/*)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit"
description = "Applies targeted edits to an existing file."
requires = { trust = "trusted" }
delta = {}

# ─── Write: create freely; protect what executes later ─────────────────────
#
# `write` is the create path (new files, notes, reports) and stays open —
# with two families fenced. First, anything credential-shaped (an untrusted
# flow must not be laundered into secrets). Second, the files that execute
# later with more privilege than the session: tests (a poisoned test that
# always passes), devops (Makefile, justfile, scripts/, CI workflows,
# Dockerfiles), and infra (terraform, k8s, helm, ansible, pulumi). Poison
# that persists or executes is the memory-poisoning problem, spelled for
