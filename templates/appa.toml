# ─── Web sources: foreign text, and a query that leaves the machine ────────
#
# The official default's dual rule, spelled for Pi's tools: the content is
# suspicious (someone else wrote it), and the query itself is a public sink
# — so a session that has read `.env` (self-narrowed) is refused web
# research until it can prove the query shareable, which it cannot. Fresh
# sessions start public and research freely.

[[policy.tool]]
name = "host/claude-code/web_explore"
description = "Researches a web question with search and fetch passes."
delta = {}

[[policy.tool]]
name = "host/claude-code/resolve-library-id"
description = "Resolves a package name to a Context7 library ID."
delta = {}

[[policy.tool]]
name = "host/claude-code/query-docs"
description = "Queries Context7 documentation for a library."
delta = {}

# codemode composes other tools' results; each nested tool call is itself
# gated (they are events in the same trajectory), so taint enters at the
# nested source, not here. Marking codemode itself suspicious would
# over-taint every later edit after routine script use.

[[policy.tool]]
name = "host/claude-code/codemode"
description = "Runs JavaScript that calls other tools."
delta = {}

# ─── Subagent delegation ───────────────────────────────────────────────────
#
# Spawning is mediated as a plain tool call. `context_control` below makes
# the runtime treat the child's context as exactly the spawn call's prompt,
# so the child's return is checked as a branch of this trajectory — with
# `attest-schema` available to let a schema-matching structured return
# cross at this session's own trust.

[[policy.tool]]
name = "host/claude-code/subagent"
description = "Delegates work to a specialized subagent."
delta = {}

# ─── Harness bookkeeping: session-local state and memory ───────────────────
